# In-house deployment (production phase, after the Railway pilot).
# Usage: copy .env.example to .env, fill it in, then `docker compose up -d --build`
services:
  autopilot:
    build: .
    container_name: t3c-1st-auto
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
    volumes:
      # Holds follow-up timers, nudge counts, run history — back this up
      - t3c-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3002)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  t3c-data:
